# Secret = same idea as ConfigMap but for sensitive values. Kubernetes
# stores it base64-encoded (NOT encrypted by default — that's a separate
# concern called "encryption at rest" you enable at the cluster level).
# `stringData` lets you write plaintext here and K8s base64-encodes it
# for you on apply, instead of you doing `echo -n foo | base64` by hand.
#
# This file is fine for local learning. Never commit real secrets like
# this to git — in Phase 3 you'll swap this for Sealed Secrets or
# External Secrets Operator pulling from AWS Secrets Manager, which is
# closer to what you already do on the ECS side.
apiVersion: v1
kind: Secret
metadata:
  name: orders-api-secret
  namespace: k8s-learning
type: Opaque
stringData:
  DB_USER: orders_user
  DB_PASSWORD: change_me_locally
