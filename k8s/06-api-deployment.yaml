apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: k8s-learning
spec:
  replicas: 2   # start with 2 so you can see rolling behavior, load balancing, etc.
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: orders-api:local   # build this locally and load it into kind (see README)
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: orders-api-config
            - secretRef:
                name: orders-api-secret
          # requests = what the scheduler reserves for this pod when placing it on a node.
          # limits = the hard ceiling the container is allowed to use.
          # The HPA's "50% utilization" target below is 50% of the CPU *request*, not the node.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          # Readiness: pulled out of the Service's load-balancing pool if this fails.
          # Doesn't restart the pod — just stops sending it traffic.
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          # Liveness: if this fails repeatedly, kubelet kills and restarts the container.
          # Deliberately checks a DB-independent endpoint so a slow DB doesn't cause
          # a restart storm on top of a DB problem.
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
